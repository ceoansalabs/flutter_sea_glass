name: flutter_sea_glass
description: >-
  Sea glass and liquid glass for Flutter: tumbled, frosted and colored glass,
  milky pastel slabs and living shapes, rendered with Impeller.
version: 0.1.0-dev.1

repository: https://github.com/padmanabanSampath/flutter_sea_glass
issue_tracker: https://github.com/padmanabanSampath/flutter_sea_glass/issues
screenshots:
  - description: "Sea glass controls in light mode"
    path: doc/readme/sea-glass-light.jpg
  - description: "Slab sea glass components"
    path: doc/readme/slab-sea-glass.jpg

topics:
  - sea-glass
  - liquid-glass
  - glassmorphism
  - shaders
  - effects

environment:
  sdk: ">=3.13.0 <3.14.0"
  flutter: ">=3.47.0"

# Real glass needs Impeller and Flutter GPU (macOS, iOS, Android). The web
# build compiles and renders the fake-glass fallback.
platforms:
  macos:
  ios:
  android:
  web:

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  flutter_shaders: ^0.1.3
  hooks: ^2.0.2
  logging: ^1.3.0
  meta: ^1.16.0
  motor: ^1.0.1

dev_dependencies:
  alchemist: ^0.12.1
  flutter_test:
    sdk: flutter
  lintervention: ^0.3.1
  mocktail: ^1.0.3
  snaptest: ^0.2.3

flutter:
  uses-material-design: true
  shaders:
    - lib/assets/shaders/liquid_glass_final_render.frag
    - lib/assets/shaders/liquid_glass_final_render_material.frag
    - lib/assets/shaders/liquid_glass_final_render_tint.frag
    - lib/assets/shaders/fake_glass_surface.frag
  assets:
    - build/shaderbundles/
